<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<!-- Ask Telegram's / the browser's cache to always revalidate this page itself — without this,
     a cached copy of index.html keeps referencing OLD ?v= numbers below forever, so bumping the
     numbers alone doesn't help until this page is also refetched. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Історія України · Тренажер НМТ</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=PT+Sans:wght@400;700&display=swap" />
<!-- ==== CACHE VERSION ====
     Telegram's in-app browser caches this app more aggressively than a normal mobile browser and
     often ignores query strings on style.css/app.js/etc. The one thing that reliably forces a
     refetch is changing the URL registered with @BotFather itself (Menu Button / Mini App URL),
     because Telegram caches by the full page URL. So after any visible change:
       1) bump every "?v=N" below to the same new N (already done for this change: v=7)
       2) go to @BotFather → the URL of this Mini App → change it to end with "?v=7" too
          (same number as here) — that is what actually busts Telegram's cache, not this file alone.
     Until step 2 is done, Telegram may keep showing the old design even after a full close+reopen. -->
<link rel="stylesheet" href="style.css?v=7" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app"></div>

  <script src="config.js?v=7"></script>
  <script src="questions.js?v=7"></script>
  <script src="flashcards.js?v=7"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
